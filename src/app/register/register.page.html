<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Atrás"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding register-content">
  <div class="register-container">
    <!-- Logotipo superior -->
    <div class="logo-section">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Logo Servicio Automotriz Cortes" class="logo-img" />
      <div class="brand-text">
        <span class="subtitle-top">SERVICIO AUTOMOTRIZ</span>
        <h1>CORTES</h1>
      </div>
    </div>

    <!-- Títulos -->
    <div class="header-section">
      <h2>Crear cuenta</h2>
      <p>Regístrate para comenzar</p>
    </div>

    <!-- Contenedor del formulario -->
    <div class="register-form">
      <ion-item lines="solid" class="input-item">
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Correo electrónico" labelPlacement="stacked" placeholder="Correo electrónico" type="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item lines="solid" class="input-item">
        <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Contraseña" labelPlacement="stacked" placeholder="Contraseña" type="password" [(ngModel)]="password"></ion-input>
        <ion-icon name="eye-outline" slot="end" color="medium" style="cursor: pointer;"></ion-icon>
      </ion-item>

      <ion-item lines="solid" class="input-item">
        <ion-icon name="call-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Teléfono" labelPlacement="stacked" placeholder="Teléfono" type="tel" [(ngModel)]="phone"></ion-input>
      </ion-item>

      <ion-item lines="solid" class="input-item">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Nombre" labelPlacement="stacked" placeholder="Nombre" type="text" [(ngModel)]="name"></ion-input>
      </ion-item>

      <ion-item lines="solid" class="input-item">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Apellido paterno" labelPlacement="stacked" placeholder="Apellido paterno" type="text" [(ngModel)]="paternalLastName"></ion-input>
      </ion-item>

      <ion-item lines="solid" class="input-item">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input label="Apellido materno" labelPlacement="stacked" placeholder="Apellido materno" type="text" [(ngModel)]="maternalLastName"></ion-input>
      </ion-item>

      <ion-button expand="block" class="btn-submit" (click)="onRegister()">
        Registrarse
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>

      <ion-button expand="block" fill="outline" class="btn-login-back" routerLink="/login">
        Ya tengo cuenta
      </ion-button>
    </div>
  </div>
</ion-content>
