<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/vehicles" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Registrar automóvil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding content">
  <div class="container">
    
    <!-- Ilustración de auto -->
    <div class="header-illustration">
      <div class="car-circle">
        <ion-icon name="car-outline"></ion-icon>
      </div>
      <h2>Agrega tu automóvil</h2>
      <p>Completa la información de tu vehículo para administrarlo fácilmente.</p>
    </div>

    <!-- Formulario -->
    <div class="form-card">
      
      <div class="input-group">
        <label>Marca</label>
        <input type="text" placeholder="Ej. Toyota, Nissan, Ford..." [(ngModel)]="brand" />
      </div>

      <div class="input-group">
        <label>Modelo</label>
        <input type="text" placeholder="Ej. Corolla, Sentra, Versa..." [(ngModel)]="model" />
      </div>

      <div class="input-group">
        <label>Matrícula</label>
        <input type="text" placeholder="Ej. ABC-123" [(ngModel)]="plate" />
      </div>

      <div class="input-group">
        <label>Año</label>
        <select [(ngModel)]="year">
          <option *ngFor="let y of years" [value]="y">{{ y }}</option>
        </select>
      </div>

      <div class="input-group">
        <label>Kilometraje (km)</label>
        <input type="number" placeholder="Ej. 45000" [(ngModel)]="mileage" />
      </div>

      <div class="input-group">
        <label>Color</label>
        <select [(ngModel)]="color">
          <option value="" disabled selected>Selecciona el color</option>
          <option *ngFor="let c of colors" [value]="c">{{ c }}</option>
        </select>
      </div>

    </div>

    <!-- Botones de acción -->
    <div class="actions">
      <ion-button expand="block" class="btn-save" (click)="saveVehicle()">Guardar automóvil</ion-button>
      <ion-button expand="block" fill="clear" class="btn-cancel" (click)="cancel()">Cancelar</ion-button>
    </div>

  </div>
</ion-content>

<!-- Navegación inferior -->
<div class="bottom-nav">
  <div class="nav-item" routerLink="/dashboard"><ion-icon name="home-outline"></ion-icon><span>Inicio</span></div>
  <div class="nav-item" routerLink="/cart"><ion-icon name="cart-outline"></ion-icon><span>Carrito</span></div>
  <div class="nav-item" routerLink="/appointments"><ion-icon name="calendar-outline"></ion-icon><span>Citas</span></div>
  <div class="nav-item" routerLink="/vehicles"><ion-icon name="person-outline"></ion-icon><span>Perfil</span></div>
</div>
