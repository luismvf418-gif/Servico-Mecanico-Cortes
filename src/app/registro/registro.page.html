<ion-header class="ion-no-border">
  <ion-toolbar class="barra-superior">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/iniciar-sesion" text="Atrás"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-registro">
  <div class="contenedor-registro">
    
    <div class="seccion-logo">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Logo Servicio Automotriz Cortes" class="imagen-logo" />
      <div class="texto-marca">
        <span class="subtitulo-superior">SERVICIO AUTOMOTRIZ</span>
        <h1>CORTES</h1>
      </div>
    </div>

    <div class="seccion-encabezado">
      <h2>Crear cuenta</h2>
      <p>Regístrate para comenzar</p>
    </div>

    <div class="formulario-registro">
      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <ion-input
          label="Correo electrónico"
          labelPlacement="stacked"
          placeholder="ejemplo@correo.com"
          type="email"
          [(ngModel)]="correo">
        </ion-input>
      </ion-item>

      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          placeholder="••••••••"
          [type]="verContrasena ? 'text' : 'password'"
          [(ngModel)]="contrasena">
        </ion-input>
        <ion-icon
          [name]="verContrasena ? 'eye-off-outline' : 'eye-outline'"
          slot="end"
          color="medium"
          style="cursor: pointer;"
          (click)="verContrasena = !verContrasena">
        </ion-icon>
      </ion-item>

      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="call-outline" slot="start" color="medium"></ion-icon>
        <ion-input
          label="Teléfono"
          labelPlacement="stacked"
          placeholder="5551234567"
          type="tel"
          [(ngModel)]="telefono">
        </ion-input>
      </ion-item>

      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input
          label="Nombre"
          labelPlacement="stacked"
          placeholder="Nombre"
          type="text"
          [(ngModel)]="nombre">
        </ion-input>
      </ion-item>

      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input
          label="Apellido paterno"
          labelPlacement="stacked"
          placeholder="Apellido paterno"
          type="text"
          [(ngModel)]="apellido_paterno">
        </ion-input>
      </ion-item>

      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
        <ion-input
          label="Apellido materno"
          labelPlacement="stacked"
          placeholder="Apellido materno (opcional)"
          type="text"
          [(ngModel)]="apellido_materno">
        </ion-input>
      </ion-item>

      <ion-button expand="block" class="boton-enviar" (click)="onRegister()">
        Registrarse
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>

      <ion-button expand="block" fill="outline" class="boton-regresar-login" routerLink="/iniciar-sesion">
        Ya tengo cuenta
      </ion-button>
    </div>

  </div>
</ion-content>
