<!-- Encabezado superior (sin bordes) -->
<ion-header class="ion-no-border">
  <ion-toolbar class="barra-superior">
    <ion-buttons slot="start">
      <!-- Botón para regresar a la pantalla de bienvenida -->
      <ion-back-button defaultHref="/bienvenida" text="Atrás"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- Contenido principal con padding -->
<ion-content class="ion-padding contenido-login">
  <div class="contenedor-login">
    
    <!-- Logotipo superior y texto de la marca -->
    <div class="seccion-logo">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Logo Servicio Automotriz Cortes" class="imagen-logo" />
      <div class="texto-marca">
        <span class="subtitulo-superior">SERVICIO AUTOMOTRIZ</span>
        <h1>CORTES</h1>
      </div>
    </div>

    <!-- Títulos de bienvenida al login -->
    <div class="seccion-encabezado">
      <h2>Inicia sesión</h2>
      <p>Accede para continuar</p>
    </div>

    <!-- Contenedor del formulario de inicio de sesión -->
    <div class="formulario-login">
      
      <!-- Campo: Correo electrónico -->
      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <!-- Quitamos [(ngModel)]="email" para que sea un diseño estático -->
        <ion-input 
          label="Correo electrónico" 
          labelPlacement="stacked" 
          placeholder="Correo electrónico" 
          type="email">
        </ion-input>
      </ion-item>

      <!-- Campo: Contraseña -->
      <ion-item lines="solid" class="item-entrada">
        <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
        <!-- Quitamos [(ngModel)]="password" -->
        <ion-input 
          label="Contraseña" 
          labelPlacement="stacked" 
          placeholder="Contraseña" 
          type="password">
        </ion-input>
        <!-- Icono para mostrar/ocultar contraseña (estático por ahora) -->
        <ion-icon name="eye-outline" slot="end" color="medium" style="cursor: pointer;"></ion-icon>
      </ion-item>

      <!-- Enlace: ¿Olvidaste tu contraseña? -->
      <div class="recuperar-contrasena">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón principal de Iniciar sesión -->
      <!-- Quitamos el evento (click)="onLogin()" y le pusimos un enlace temporal directo al inicio -->
      <ion-button expand="block" class="boton-enviar" routerLink="/inicio">
        Iniciar sesión
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>

      <!-- Botón secundario para crear cuenta nueva -->
      <ion-button expand="block" fill="outline" class="boton-crear" routerLink="/registro">
        Crear cuenta
      </ion-button>
      
    </div>
  </div>
</ion-content>
