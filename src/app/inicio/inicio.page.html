<ion-header class="ion-no-border">
  <ion-toolbar class="barra-inicio">
    <div class="contenedor-logo">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Servicio Automotriz Cortes" class="logo-app" />
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-inicio">
  <div class="contenedor-inicio">

    <div class="seccion-bienvenida">
      <h2>¡Hola, {{ nombreUsuario }}!</h2>
      <p>¿Qué necesitas hoy?</p>
    </div>

    <div class="cuadricula-menu">
      @for (opcion of opcionesMenu; track opcion.ruta) {
        <div class="tarjeta-dashboard" [routerLink]="opcion.ruta">
          <div class="circulo-icono">
            <ion-icon [name]="opcion.icono"></ion-icon>
          </div>
          <div class="info-tarjeta">
            <h3>{{ opcion.titulo }}</h3>
            <p>
              {{ opcion.ruta === '/carrito' && cantidadCarrito > 0
                ? 'Tienes ' + cantidadCarrito + ' servicio(s) seleccionado(s)'
                : opcion.descripcion }}
            </p>
          </div>
          <div class="icono-flecha">
            <ion-icon name="chevron-forward-outline"></ion-icon>
          </div>
        </div>
      }
    </div>

  </div>
</ion-content>

<div class="navegacion-inferior">
  <div class="elemento-navegacion activo" routerLink="/inicio">
    <ion-icon name="home-outline"></ion-icon>
    <span>Inicio</span>
    <div class="indicador"></div>
  </div>
  <div class="elemento-navegacion" routerLink="/carrito">
    <ion-icon name="cart-outline"></ion-icon>
    <span>Carrito</span>
  </div>
  <div class="elemento-navegacion" routerLink="/citas-lista">
    <ion-icon name="calendar-outline"></ion-icon>
    <span>Citas</span>
  </div>
  <div class="elemento-navegacion" routerLink="/perfil">
    <ion-icon name="person-outline"></ion-icon>
    <span>Perfil</span>
  </div>
</div>
