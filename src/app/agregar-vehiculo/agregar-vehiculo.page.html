<ion-header class="ion-no-border">
  <ion-toolbar class="barra-herramientas">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/vehiculos" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Registrar automóvil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-principal">
  <div class="contenedor-principal">

    <div class="encabezado-ilustracion">
      <div class="circulo-auto">
        <ion-icon name="car-outline"></ion-icon>
      </div>
      <h2>Agrega tu automóvil</h2>
      <p>Completa la información de tu vehículo para administrarlo fácilmente.</p>
    </div>

    <div class="tarjeta-formulario">
      <div class="grupo-campo">
        <label>Marca</label>
        <input type="text" placeholder="Ej. Toyota, Nissan, Ford..." [(ngModel)]="marca" />
      </div>

      <div class="grupo-campo">
        <label>Modelo</label>
        <input type="text" placeholder="Ej. Corolla, Sentra, Versa..." [(ngModel)]="modelo" />
      </div>

      <div class="grupo-campo">
        <label>Matrícula</label>
        <input type="text" placeholder="Ej. ABC-123" [(ngModel)]="placas" />
      </div>

      <div class="grupo-campo">
        <label>Año</label>
        <select [(ngModel)]="anio">
          <option value="" disabled>Selecciona el año</option>
          @for (itemAnio of anios; track itemAnio) {
            <option [value]="itemAnio">{{ itemAnio }}</option>
          }
        </select>
      </div>

      <div class="grupo-campo">
        <label>Kilometraje (km)</label>
        <input type="number" placeholder="Ej. 45000" [(ngModel)]="kilometraje" />
      </div>

      <div class="grupo-campo">
        <label>Color</label>
        <select [(ngModel)]="color">
          <option value="" disabled>Selecciona el color</option>
          @for (itemColor of colores; track itemColor) {
            <option [value]="itemColor">{{ itemColor }}</option>
          }
        </select>
      </div>
    </div>

    <div class="acciones-botones">
      <ion-button expand="block" class="boton-guardar" (click)="guardarVehiculo()">
        Guardar automóvil
      </ion-button>
      <ion-button expand="block" fill="clear" class="boton-cancelar" (click)="cancelar()">
        Cancelar
      </ion-button>
    </div>

  </div>
</ion-content>

<div class="navegacion-inferior">
  <div class="elemento-navegacion" routerLink="/inicio">
    <ion-icon name="home-outline"></ion-icon>
    <span>Inicio</span>
  </div>
  <div class="elemento-navegacion" routerLink="/carrito">
    <ion-icon name="cart-outline"></ion-icon>
    <span>Carrito</span>
  </div>
  <div class="elemento-navegacion" routerLink="/citas-lista">
    <ion-icon name="calendar-outline"></ion-icon>
    <span>Citas</span>
  </div>
  <div class="elemento-navegacion" routerLink="/perfil">
    <ion-icon name="person-outline"></ion-icon>
    <span>Perfil</span>
  </div>
</div>
