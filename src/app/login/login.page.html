<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/welcome" text="Atrás"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding login-content">
  <div class="login-container">
    <!-- Logotipo superior -->
    <div class="logo-section">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Logo Servicio Automotriz Cortes" class="logo-img" />
      <div class="brand-text">
        <span class="subtitle-top">SERVICIO AUTOMOTRIZ</span>
        <h1>CORTES</h1>
      </div>
    </div>

    <!-- Títulos -->
    <div class="header-section">
      <h2>Inicia sesión</h2>
      <p>Accede para continuar</p>
    </div>

    <!-- Contenedor del formulario -->
    <div class="login-form">
      <ion-item lines="solid" class="input-item">
        <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
        <ion-input 
          label="Correo electrónico" 
          labelPlacement="stacked" 
          placeholder="Correo electrónico" 
          type="email" 
          [(ngModel)]="email">
        </ion-input>
      </ion-item>

      <ion-item lines="solid" class="input-item">
        <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
        <ion-input 
          label="Contraseña" 
          labelPlacement="stacked" 
          placeholder="Contraseña" 
          type="password" 
          [(ngModel)]="password">
        </ion-input>
        <ion-icon name="eye-outline" slot="end" color="medium" style="cursor: pointer;"></ion-icon>
      </ion-item>

      <div class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <ion-button expand="block" class="btn-submit" (click)="onLogin()">
        Iniciar sesión
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>

      <ion-button expand="block" fill="outline" class="btn-create" routerLink="/register">
        Crear cuenta
      </ion-button>
    </div>
  </div>
</ion-content>
