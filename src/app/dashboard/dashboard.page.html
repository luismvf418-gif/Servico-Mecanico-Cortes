<ion-header class="ion-no-border">
  <ion-toolbar class="dashboard-toolbar">
    <!-- Logotipo real apuntando a la carpeta imagenes -->
    <div class="logo-container">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Servicio Automotriz Cortes" class="app-logo" />
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding dashboard-content">
  <div class="dashboard-container">

    <!-- Sección de Bienvenida -->
    <div class="welcome-section">
      <h2>¡Hola, Usuario!</h2>
      <p>¿Qué necesitas hoy?</p>
    </div>

    <!-- Cuadrícula de 2 columnas -->
    <div class="menu-grid">
      
      <!-- Servicios -->
      <div class="dashboard-card" routerLink="/services">
        <div class="icon-circle">
          <ion-icon name="construct-outline"></ion-icon>
        </div>
        <div class="card-info">
          <h3>Servicios</h3>
          <p>Conoce nuestros servicios automotrices</p>
        </div>
        <div class="arrow-icon">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>

      <!-- Mis automóviles -->
      <div class="dashboard-card" routerLink="/vehicles">
        <div class="icon-circle">
          <ion-icon name="car-outline"></ion-icon>
        </div>
        <div class="card-info">
          <h3>Mis automóviles</h3>
          <p>Administra tus vehículos</p>
        </div>
        <div class="arrow-icon">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>

      <!-- Mis citas -->
      <div class="dashboard-card" routerLink="/appointments-list">
        <div class="icon-circle">
          <ion-icon name="calendar-outline"></ion-icon>
        </div>
        <div class="card-info">
          <h3>Mis citas</h3>
          <p>Consulta y agenda tus citas</p>
        </div>
        <div class="arrow-icon">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>

      <!-- Carrito -->
      <div class="dashboard-card" routerLink="/cart">
        <div class="icon-circle">
          <ion-icon name="cart-outline"></ion-icon>
        </div>
        <div class="card-info">
          <h3>Carrito</h3>
          <p>Revisa tus servicios y productos</p>
        </div>
        <div class="arrow-icon">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>

    </div>

  </div>
</ion-content>

<!-- Barra de navegación inferior -->
<div class="bottom-nav">
  <div class="nav-item active" routerLink="/dashboard">
    <ion-icon name="home-outline"></ion-icon>
    <span>Inicio</span>
    <div class="indicator"></div>
  </div>
  <div class="nav-item" routerLink="/cart">
    <ion-icon name="cart-outline"></ion-icon>
    <span>Carrito</span>
  </div>
  <div class="nav-item" routerLink="/appointments-list">
    <ion-icon name="calendar-outline"></ion-icon>
    <span>Citas</span>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
    <span>Perfil</span>
  </div>
</div>
