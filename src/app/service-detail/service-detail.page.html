<ion-header class="ion-no-border">
  <ion-toolbar class="detail-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/services" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle del servicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding detail-content">
  <div class="detail-container">

    <!-- Tarjeta Principal del Servicio -->
    <div class="main-service-card">
      <div class="service-header-row">
        <div class="icon-circle">
          <ion-icon [name]="service.icon"></ion-icon>
        </div>
        <div class="service-titles">
          <h2>{{ service.title }}</h2>
          <p>{{ service.subtitle }}</p>
        </div>
      </div>

      <div class="service-meta-row">
        <div class="meta-item">
          <div class="meta-icon">
            <ion-icon name="pricetag-outline"></ion-icon>
          </div>
          <div class="meta-texts">
            <span class="label">Precio</span>
            <span class="value">{{ service.price }}</span>
          </div>
        </div>

        <div class="meta-divider"></div>

        <div class="meta-item">
          <div class="meta-icon">
            <ion-icon name="time-outline"></ion-icon>
          </div>
          <div class="meta-texts">
            <span class="label">Duración estimada</span>
            <span class="value">{{ service.duration }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección Descripción -->
    <div class="section-block">
      <h3>Descripción</h3>
      <p class="description-text">{{ service.description }}</p>
    </div>

    <!-- Sección ¿Qué incluye? -->
    <div class="section-block">
      <h3>¿Qué incluye?</h3>
      <div class="includes-card">
        <div class="include-item" *ngFor="let item of service.includes; let last = last" [class.no-border]="last">
          <div class="include-icon">
            <ion-icon [name]="item.icon"></ion-icon>
          </div>
          <span class="include-text">{{ item.text }}</span>
        </div>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="action-buttons">
      <ion-button expand="block" class="btn-add-cart" (click)="addToCart()">
        <ion-icon name="cart-outline" slot="start"></ion-icon>
        Agregar al carrito
      </ion-button>
      
      <ion-button expand="block" fill="clear" class="btn-back" routerLink="/services">
        Volver
      </ion-button>
    </div>

  </div>
</ion-content>

<!-- Barra de navegación inferior -->
<div class="bottom-nav">
  <div class="nav-item" routerLink="/dashboard">
    <ion-icon name="home-outline"></ion-icon>
    <span>Inicio</span>
  </div>
  <div class="nav-item" routerLink="/cart">
    <ion-icon name="cart-outline"></ion-icon>
    <span>Carrito</span>
  </div>
  <div class="nav-item" routerLink="/appointments">
    <ion-icon name="calendar-outline"></ion-icon>
    <span>Citas</span>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
    <span>Perfil</span>
  </div>
</div>
