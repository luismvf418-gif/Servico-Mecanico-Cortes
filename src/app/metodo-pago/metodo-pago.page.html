<ion-header class="ion-no-border">
  <ion-toolbar class="barra-herramientas">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/cita-resumen" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Método de pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-principal">
  <div class="contenedor-principal">

    <p class="subtitulo">Selecciona un método de pago</p>

    <div class="lista-metodos">
      @for (metodo of metodos; track metodo.titulo) {
        <div
          class="tarjeta-metodo"
          [class.seleccionada]="metodoSeleccionado === metodo.titulo"
          (click)="metodoSeleccionado = metodo.titulo">
          <div class="metodo-izq">
            <div class="punto-radio" [class.activo]="metodoSeleccionado === metodo.titulo"></div>
            <div class="icono-metodo">
              <ion-icon [name]="metodo.icono"></ion-icon>
            </div>
            <div class="info-metodo">
              <h3>{{ metodo.titulo }}</h3>
              <p>{{ metodo.descripcion }}</p>
            </div>
          </div>
        </div>
      }
    </div>

    @if (metodoSeleccionado === 'Tarjeta de crédito/débito') {
      <div class="seccion-formulario-tarjeta">
        <h3>Datos de la tarjeta (Modo Sandbox)</h3>

        <!-- Botones rápidos de prueba Sandbox -->
        <div style="display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;">
          <button
            type="button"
            style="flex: 1; padding: 6px; border-radius: 8px; border: 1px solid #137333; background: #e6f4ea; color: #137333; font-size: 11px; font-weight: 700;"
            (click)="rellenarTarjetaPrueba('exito')">
            Test Éxito
          </button>
          <button
            type="button"
            style="flex: 1; padding: 6px; border-radius: 8px; border: 1px solid #b06000; background: #fef7e0; color: #b06000; font-size: 11px; font-weight: 700;"
            (click)="rellenarTarjetaPrueba('pendiente')">
            Test Pendiente
          </button>
          <button
            type="button"
            style="flex: 1; padding: 6px; border-radius: 8px; border: 1px solid #c5221f; background: #fce8e6; color: #c5221f; font-size: 11px; font-weight: 700;"
            (click)="rellenarTarjetaPrueba('fallo')">
            Test Fallo
          </button>
        </div>

        <div class="grupo-entrada">
          <label>Número de tarjeta</label>
          <input
            type="text"
            placeholder="4242 4242 4242 4242"
            maxlength="19"
            [(ngModel)]="numeroTarjeta" />
        </div>

        <div class="fila-entradas">
          <div class="grupo-entrada">
            <label>Fecha de expiración</label>
            <input
              type="text"
              placeholder="MM/AA"
              maxlength="5"
              [(ngModel)]="expiracion" />
          </div>
          <div class="grupo-entrada">
            <label>CVV</label>
            <input
              type="password"
              placeholder="123"
              maxlength="4"
              [(ngModel)]="cvv" />
          </div>
        </div>

        <div class="grupo-entrada">
          <label>Nombre del titular</label>
          <input
            type="text"
            placeholder="Como aparece en la tarjeta"
            [(ngModel)]="titular" />
        </div>
      </div>
    }

    <div class="contenedor-accion">
      <ion-button expand="block" class="boton-continuar" (click)="continuar()">
        Continuar
      </ion-button>
    </div>

  </div>
</ion-content>

<div class="navegacion-inferior">
  <div class="elemento-navegacion" routerLink="/inicio"><ion-icon name="home-outline"></ion-icon><span>Inicio</span></div>
  <div class="elemento-navegacion" routerLink="/carrito"><ion-icon name="cart-outline"></ion-icon><span>Carrito</span></div>
  <div class="elemento-navegacion activo" routerLink="/citas-lista"><ion-icon name="calendar-outline"></ion-icon><span>Citas</span></div>
  <div class="elemento-navegacion" routerLink="/perfil"><ion-icon name="person-outline"></ion-icon><span>Perfil</span></div>
</div>
