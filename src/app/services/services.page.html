<ion-header class="ion-no-border">
  <ion-toolbar class="services-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Servicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding services-content">
  <div class="services-container">

    <!-- Barra de búsqueda conectada -->
    <div class="search-box">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input 
        type="text" 
        placeholder="Buscar servicios" 
        class="custom-search-input" 
        [(ngModel)]="searchQuery" />
    </div>

    <!-- Filtros por categoría (Chips) -->
    <div class="categories-scroll">
      <button 
        class="chip" 
        [class.active]="selectedCategory === 'Todos'" 
        (click)="filterCategory('Todos')">
        Todos
      </button>
      <button 
        class="chip" 
        [class.active]="selectedCategory === 'Motor'" 
        (click)="filterCategory('Motor')">
        Motor
      </button>
      <button 
        class="chip" 
        [class.active]="selectedCategory === 'Frenos'" 
        (click)="filterCategory('Frenos')">
        Frenos
      </button>
      <button 
        class="chip" 
        [class.active]="selectedCategory === 'Afinación'" 
        (click)="filterCategory('Afinación')">
        Afinación
      </button>
      <button 
        class="chip" 
        [class.active]="selectedCategory === 'Suspensión'" 
        (click)="filterCategory('Suspensión')">
        Suspensión
      </button>
    </div>

    <!-- Lista de Servicios filtrados con routerLink dinámico y botón de agregar funcional -->
    <div class="services-list">
      <div class="service-card" *ngFor="let service of filteredServices; let i = index" [routerLink]="['/service-detail', i]">
        <div class="service-left">
          <div class="icon-circle">
            <ion-icon [name]="service.icon"></ion-icon>
          </div>
          <div class="service-info">
            <h3>{{ service.title }}</h3>
            <p>{{ service.description }}</p>
          </div>
        </div>
        
        <div class="service-right">
          <span class="price-label">Desde</span>
          <span class="price-value">{{ service.price }}</span>
          <!-- Usamos un botón HTML normal con clase de Ionic para evitar bloqueos de routerLink -->
          <button type="button" class="btn-add-custom" (click)="addToCart(service, $event)">
            <ion-icon name="cart-outline"></ion-icon>
            Agregar
          </button>
        </div>
      </div>
    </div>

  </div>
</ion-content>

<!-- Barra de navegación inferior -->
<div class="bottom-nav">
  <div class="nav-item" routerLink="/dashboard">
    <ion-icon name="home-outline"></ion-icon>
    <span>Inicio</span>
  </div>
  <div class="nav-item" routerLink="/cart">
    <ion-icon name="cart-outline"></ion-icon>
    <span>Carrito</span>
  </div>
  <div class="nav-item" routerLink="/appointments">
    <ion-icon name="calendar-outline"></ion-icon>
    <span>Citas</span>
  </div>
  <div class="nav-item">
    <ion-icon name="person-outline"></ion-icon>
    <span>Perfil</span>
  </div>
</div>
