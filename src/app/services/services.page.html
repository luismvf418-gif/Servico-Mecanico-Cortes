<ion-header class="ion-no-border">
  <ion-toolbar class="barra-servicios">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Servicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding contenido-servicios">
  <div class="contenedor-servicios">

    <div class="caja-busqueda">
      <ion-icon name="search-outline" class="icono-busqueda"></ion-icon>
      <input
        type="text"
        placeholder="Buscar servicios"
        class="entrada-busqueda-personalizada"
        [(ngModel)]="busqueda" />
    </div>

    <div class="desplazamiento-categorias">
      @for (cat of categorias; track cat) {
        <button
          type="button"
          class="chip"
          [class.activo]="categoriaActiva === cat"
          (click)="categoriaActiva = cat">
          {{ cat }}
        </button>
      }
    </div>

    <div class="lista-servicios">
      @for (servicio of serviciosFiltrados; track servicio.id_servicio) {
        <div class="tarjeta-servicio" [routerLink]="['/servicio-detalle', servicio.id_servicio]">
          <div class="servicio-izq">
            <div class="circulo-icono">
              <ion-icon [name]="servicio.icono"></ion-icon>
            </div>
            <div class="info-servicio">
              <h3>{{ servicio.nombre_servicio }}</h3>
              <p>{{ servicio.descripcion }}</p>
            </div>
          </div>

          <div class="servicio-der">
            <span class="etiqueta-precio">Desde</span>
            <span class="valor-precio">${{ servicio.precio }}</span>
            <button
              type="button"
              class="boton-agregar-personalizado"
              (click)="agregarAlCarrito($event, servicio)">
              <ion-icon name="cart-outline"></ion-icon>
              Agregar
            </button>
          </div>
        </div>
      } @empty {
        <p class="ion-text-center">No se encontraron servicios con ese filtro.</p>
      }
    </div>

  </div>
</ion-content>

<div class="navegacion-inferior">
  <div class="elemento-navegacion" routerLink="/inicio">
    <ion-icon name="home-outline"></ion-icon>
    <span>Inicio</span>
  </div>
  <div class="elemento-navegacion" routerLink="/carrito">
    <ion-icon name="cart-outline"></ion-icon>
    <span>Carrito</span>
  </div>
  <div class="elemento-navegacion" routerLink="/citas-lista">
    <ion-icon name="calendar-outline"></ion-icon>
    <span>Citas</span>
  </div>
  <div class="elemento-navegacion" routerLink="/perfil">
    <ion-icon name="person-outline"></ion-icon>
    <span>Perfil</span>
  </div>
</div>
