<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/appointments" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Método de pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding content">
  <div class="container">
    
    <p class="subtitle">Selecciona un método de pago</p>

    <!-- Opciones de pago -->
    <div class="methods-list">
      
      <!-- Tarjeta -->
      <div class="method-card" [class.selected]="selectedMethod === 'card'" (click)="selectMethod('card')">
        <div class="method-left">
          <div class="radio-dot" [class.active]="selectedMethod === 'card'"></div>
          <div class="method-icon"><ion-icon name="card-outline"></ion-icon></div>
          <div class="method-info">
            <h3>Tarjeta de crédito/débito</h3>
            <p>Pago de forma segura con tu tarjeta</p>
          </div>
        </div>
      </div>

      <!-- Transferencia -->
      <div class="method-card" [class.selected]="selectedMethod === 'transfer'" (click)="selectMethod('transfer')">
        <div class="method-left">
          <div class="radio-dot" [class.active]="selectedMethod === 'transfer'"></div>
          <div class="method-icon"><ion-icon name="business-outline"></ion-icon></div>
          <div class="method-info">
            <h3>Transferencia bancaria</h3>
            <p>Realiza el pago desde tu banco</p>
          </div>
        </div>
      </div>

      <!-- Pago en taller -->
      <div class="method-card" [class.selected]="selectedMethod === 'workshop'" (click)="selectMethod('workshop')">
        <div class="method-left">
          <div class="radio-dot" [class.active]="selectedMethod === 'workshop'"></div>
          <div class="method-icon"><ion-icon name="card-outline"></ion-icon></div>
          <div class="method-info">
            <h3>Pago en taller</h3>
            <p>Realiza el pago al momento de tu cita</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Formulario de tarjeta (Si se selecciona tarjeta) -->
    <div class="card-form-section" *ngIf="selectedMethod === 'card'">
      <h3>Datos de la tarjeta</h3>
      
      <div class="input-group">
        <label>Número de tarjeta</label>
        <input type="text" placeholder="1234 5678 9012 3456" [(ngModel)]="cardNumber" />
      </div>

      <div class="row-inputs">
        <div class="input-group">
          <label>Fecha de expiración</label>
          <input type="text" placeholder="MM/AA" [(ngModel)]="cardExp" />
        </div>
        <div class="input-group">
          <label>CVV</label>
          <input type="password" placeholder="123" maxlength="4" [(ngModel)]="cardCvv" />
        </div>
      </div>

      <div class="input-group">
        <label>Nombre del titular</label>
        <input type="text" placeholder="Como aparece en la tarjeta" [(ngModel)]="cardHolder" />
      </div>
    </div>

    <!-- Botón Continuar -->
    <div class="action-container">
      <ion-button expand="block" class="btn-continue" (click)="proceedToSummary()">
        Continuar
      </ion-button>
    </div>

  </div>
</ion-content>

<!-- Navegación inferior -->
<div class="bottom-nav">
  <div class="nav-item" routerLink="/dashboard"><ion-icon name="home-outline"></ion-icon><span>Inicio</span></div>
  <div class="nav-item" routerLink="/cart"><ion-icon name="cart-outline"></ion-icon><span>Carrito</span></div>
  <div class="nav-item active" routerLink="/appointments"><ion-icon name="calendar-outline"></ion-icon><span>Citas</span></div>
  <div class="nav-item" routerLink="/vehicles"><ion-icon name="person-outline"></ion-icon><span>Perfil</span></div>
</div>
