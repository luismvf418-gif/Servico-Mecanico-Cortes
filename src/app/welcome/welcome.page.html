<ion-content class="ion-padding welcome-content">
  <div class="welcome-container">
    <!-- Logotipo y Títulos -->
    <div class="logo-section">
      <img src="assets/imagenes/Logotipo_inicial.png" alt="Logo Servicio Automotriz Cortes" class="logo-img" />
      <div class="brand-text">
        <!-- Espacio para textos adicionales si lo requieres -->
      </div>
    </div>

    <!-- Textos descriptivos -->
    <div class="info-section">
      <h2>Tu taller de confianza en tu bolsillo</h2>
      <p>Agenda tus citas, consulta servicios y administra tus vehículos, todo en un solo lugar.</p>
    </div>

    <!-- Botones de acción con routerLink -->
    <div class="action-section">
      <ion-button expand="block" routerLink="/login" class="btn-comenzar">
        Comenzar
      </ion-button>
      <ion-button expand="block" fill="clear" routerLink="/login" class="btn-login">
        Iniciar sesión
      </ion-button>
    </div>
  </div>
</ion-content>
